name: "Python: CD"

on:
  push:
    tags:
      - "*.*.*"

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    outputs:
      package-version: ${{ steps.package-version.outputs.package-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*
      - id: package-version
        run: |
          uv sync --locked --no-dev
          echo "package-version=$(
            uv run python -c 'import sys, xlsx_serializer; sys.stdout.write(xlsx_serializer.__version__)'
          )" >> $GITHUB_OUTPUT
  check-tag:
    name: Check tag
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          if [ "${{ needs.build.outputs.package-version }}" != "${{ github.ref_name }}" ]; then
            exit 1
          fi
  pypi:
    name: Publish package to PyPI
    needs:
      - check-tag
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: PyPI
      url: https://pypi.org/p/django-xlsx-serializer/
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
  release:
    name: Create GitHub release
    needs:
      - pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
