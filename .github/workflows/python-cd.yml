name: "Python: CD"

on:
  push:
    tags:
      - "*.*.*"

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    outputs:
      package-version: ${{ steps.package-version.outputs.package-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*
      - id: package-version
        run: |
          uv sync --locked --no-dev
          echo "package-version=$(
            uv run python -c 'import sys, xlsx_serializer; sys.stdout.write(xlsx_serializer.__version__)'
          )" >> $GITHUB_OUTPUT
  check-tag:
    name: Check tag
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          if [ "${{ needs.build.outputs.package-version }}" != "${{ github.ref_name }}" ]; then
            exit 1
          fi
  pypi:
    name: Publish package to PyPI
    needs:
      - check-tag
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: PyPI
      url: https://pypi.org/p/django-xlsx-serializer/
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
  release:
    name: Create GitHub release
    needs:
      - pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
