name: "Python: CI"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  format-nox-sessions:
    if: ${{ !startsWith(github.event.head_commit.message, 'bump:') }}
    name: Format Nox sessions
    runs-on: ubuntu-latest
    outputs:
      install-sessions: ${{ steps.nox-sessions.outputs.install-sessions }}
      lint-sessions: ${{ steps.nox-sessions.outputs.lint-sessions }}
      test-sessions: ${{ steps.nox-sessions.outputs.test-sessions }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked --only-group nox
      - id: nox-sessions
        run: |
          echo "install-sessions=$(uv run ./scripts/format_nox_sessions.py install)" >> $GITHUB_OUTPUT
          echo "lint-sessions=$(uv run ./scripts/format_nox_sessions.py lint)" >> $GITHUB_OUTPUT
          echo "test-sessions=$(uv run ./scripts/format_nox_sessions.py test)" >> $GITHUB_OUTPUT
  install:
    name: ${{ matrix.session.job }}
    needs:
      - format-nox-sessions
    runs-on: ubuntu-latest
    strategy:
      matrix:
        session: ${{ fromJson(needs.format-nox-sessions.outputs.install-sessions) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked --only-group nox
      - run: uv run --no-sync nox --session "${{ matrix.session.name }}"
  lint:
    name: ${{ matrix.session.job }}
    needs:
      - format-nox-sessions
      - install
    runs-on: ubuntu-latest
    strategy:
      matrix:
        session: ${{ fromJson(needs.format-nox-sessions.outputs.lint-sessions) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked --only-group nox
      - run: uv run --no-sync nox --session "${{ matrix.session.name }}"
  test:
    name: ${{ matrix.session.job }}
    needs:
      - format-nox-sessions
      - install
    runs-on: ubuntu-latest
    strategy:
      matrix:
        session: ${{ fromJson(needs.format-nox-sessions.outputs.test-sessions) }}
      fail-fast: false
    services:
      postgresql:
        image: ${{ contains(matrix.session.name, 'postgresql') && 'postgres:latest' || '' }}
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked --only-group nox
      - run: uv run --no-sync nox --session "${{ matrix.session.name }}"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-${{ matrix.session.name }}
          path: coverage.xml
  codecov-upload:
    name: Upload coverage to Codecov
    needs:
      - test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
      - uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
